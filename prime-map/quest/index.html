<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>質數尋寶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
/* VOICE: playful classroom arcade, big and readable on a projector
   IDEA: a pixel-game level; every prime found turns a stone block to gold
   PICTURE: the 10x10 block board under a pixel sky, mascots parading below
   COLOUR and TYPE: sky blue, navy, gold primes, checkered purple composites, pink 1; Press Start 2P + Noto Sans HK
   LAYOUT: banner, board left, status right, parade footer; stacks under 900px */
:root{color-scheme:light dark;
--sky1:light-dark(#7FD0F5,#0B1A30);--sky2:light-dark(#CDEFFF,#1A3358);--ink:light-dark(#16324F,#F3F7FA);--panel:light-dark(#FFFDF6,#16324F);
--navy:#16324F;--teal:#2E9C9C;--gold:#FFC21A;--goldd:#7A4A00;--pur:#A98BFF;--pur2:#9575F5;--purd:#2E1466;--pink:#FF8FC8;--pinkd:#7A1048;
--stone:light-dark(#FFF6DF,#2A5078);--stone2:light-dark(#F3E6C4,#244669);--stoneink:light-dark(#16324F,#F3F7FA);--line:light-dark(#16324F,#5FC4C4);
--hill:light-dark(#5BBF5B,#1F5A3A);--hill2:light-dark(#3E9E48,#174A2E)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:17px/1.55 "Noto Sans HK",system-ui,sans-serif;overflow-x:clip;min-height:100vh;
background:linear-gradient(var(--sky1),var(--sky2) 70%);background-attachment:fixed;position:relative}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky svg{position:absolute;image-rendering:pixelated}
.cloud{fill:#fff;opacity:.95}
:root[data-theme=dark] .cloud{fill:#FFE9A8;opacity:.9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .cloud{fill:#FFE9A8;opacity:.9}}
.drift{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}
.hills{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:clamp(14px,2.5vw,30px) max(3vw,12px) 40px}
.px{font-family:"Press Start 2P",monospace}
header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;margin-bottom:22px}
.mascot{width:96px;height:96px;object-fit:cover;border:5px solid var(--navy);background:#fff;box-shadow:5px 5px 0 var(--navy);animation:bob 2.4s steps(2) infinite}
.mascot.r{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
.banner{background:var(--navy);border:6px solid var(--gold);box-shadow:0 0 0 6px var(--navy),8px 10px 0 6px rgba(22,50,79,.35);padding:14px 20px;text-align:center}
h1{margin:0;font-weight:900;font-size:clamp(30px,4.6vw,52px);line-height:1.05;color:var(--gold);text-shadow:4px 4px 0 #B36B00,8px 8px 0 rgba(0,0,0,.25);letter-spacing:.04em}
.sub{margin:6px 0 0;font-weight:700;font-size:17px;color:#fff}
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:start}
.frame{width:min(100%,calc(100vh - 215px));min-width:min(100%,520px);justify-self:center;background:var(--navy);padding:12px;border:6px solid var(--teal);box-shadow:0 0 0 6px var(--navy),10px 12px 0 6px rgba(22,50,79,.3)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.cell{aspect-ratio:1;border:0;padding:0;cursor:pointer;background:var(--stone);color:var(--stoneink);font:clamp(10px,1.4vw,18px)/1 "Press Start 2P",monospace;position:relative;
box-shadow:inset 0 5px 0 rgba(255,255,255,.55),inset 0 -6px 0 rgba(0,0,0,.16),inset 5px 0 0 rgba(255,255,255,.25),inset -5px 0 0 rgba(0,0,0,.08);transition:transform .12s}
.cell:nth-child(even){background:var(--stone2)}
.cell:hover{transform:translateY(-3px)}
.cell:hover::before{content:"";position:absolute;inset:-4px;border:4px solid var(--gold);pointer-events:none}
.cell:focus-visible{outline:4px solid var(--gold);z-index:2}
.cell.p{background:linear-gradient(135deg,#FFE37A 0 30%,var(--gold) 30%);color:var(--goldd)}
.cell.c{background:repeating-conic-gradient(var(--pur) 0 25%,var(--pur2) 0 50%) 0 0/25% 25%;color:var(--purd)}
.cell.one{background:var(--pink);color:var(--pinkd)}
.cell.p::after{content:"";position:absolute;top:7%;right:7%;width:24%;height:24%;background:#fff;clip-path:polygon(40% 0,60% 0,60% 40%,100% 40%,100% 60%,60% 60%,60% 100%,40% 100%,40% 60%,0 60%,0 40%,40% 40%)}
.cell.hint{animation:blink .5s steps(2) 8}
@keyframes blink{50%{background:#FFF3A0}}
.cell.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-5deg)}100%{transform:scale(1)}}
.side{display:grid;gap:18px}
.card{background:var(--panel);border:5px solid var(--line);padding:16px 18px;box-shadow:6px 6px 0 var(--navy)}
.count{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;font-weight:900;font-size:20px}
.count b{font:clamp(28px,4vw,40px)/1 "Press Start 2P",monospace;color:#E0A000;text-shadow:3px 3px 0 var(--navy)}
.stars{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));max-width:520px;gap:4px;margin-top:12px}
.stars svg{width:100%;height:auto;display:block}
.stars .s{fill:light-dark(#E3E9EF,#2A4A6C);stroke:var(--line);stroke-width:1}
.stars .on .s{fill:var(--gold)}
.stars .on{animation:pop .5s}
.result{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:start;min-height:160px}
.result img{width:104px;height:104px;object-fit:cover;border:5px solid var(--navy);background:#fff;box-shadow:4px 4px 0 var(--teal)}
.bubble{position:relative;background:light-dark(#EAF7FF,#22466B);border:4px solid var(--line);padding:10px 14px}
.bubble::before{content:"";position:absolute;left:-14px;top:22px;width:10px;height:10px;background:var(--line);box-shadow:-6px 0 0 var(--line)}
.result h2{margin:0 0 4px;font-size:24px;font-weight:900;line-height:1.2}
.result p{margin:0 0 6px}
.dots{display:grid;gap:3px;margin-top:6px;width:max-content;max-width:100%;overflow-x:auto;padding-bottom:4px}
.dots span{width:var(--d);height:var(--d);background:var(--teal);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);border:2px solid var(--navy)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button.b{font:700 16px "Noto Sans HK",sans-serif;min-height:46px;padding:8px 16px;border:4px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),4px 4px 0 var(--navy)}
button.b:hover{background:#FFF3C4}
button.b:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--navy)}
button.b:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
button.b.main{background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700;font-size:15px}
.legend span::before{content:"";display:inline-block;width:18px;height:18px;margin-right:6px;vertical-align:-3px;border:3px solid var(--navy);background:var(--k)}
.how{margin:0;padding-left:1.3em}
.how li{margin:3px 0}
.parade{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:30px}
.parade img{width:76px;height:76px;object-fit:cover;border:4px solid var(--navy);background:#fff;box-shadow:4px 4px 0 var(--navy);animation:bob 2s steps(2) infinite}
.parade img:nth-child(odd){animation-delay:1s}
.dlg{position:fixed;inset:0;display:none;place-items:center;background:rgba(14,32,51,.7);z-index:20;padding:16px}
.dlg.open{display:grid}
.dlg .card{max-width:480px;text-align:center}
.win h2{font-size:clamp(26px,4vw,40px);margin:10px 0;color:#E0A000;text-shadow:3px 3px 0 var(--navy)}
.win .row{display:flex;justify-content:center;gap:10px}
.win img{width:92px;border:4px solid var(--navy);animation:bob 1s steps(2) infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr)}.result{grid-template-columns:76px minmax(0,1fr)}.result img{width:76px;height:76px}}
@media (max-width:600px){header{grid-template-columns:minmax(0,1fr)}.mascot{display:none}.parade img{width:56px;height:56px}.bubble::before{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:#1B2C5A var(--land) center bottom/cover no-repeat fixed;image-rendering:auto}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(27,44,90,.15),rgba(27,44,90,0) 40%);pointer-events:none}
.cell{background:var(--t-stone) center/100% 100% no-repeat;image-rendering:pixelated;box-shadow:none;color:#16324F}
.cell:nth-child(even){background:var(--t-stone) center/100% 100% no-repeat;filter:brightness(.97)}
.cell.p{background:var(--t-gold) center/100% 100% no-repeat;color:#6A3E00;text-shadow:1px 1px 0 #FFE9A0}
.cell.c{background:var(--t-purple) center/100% 100% no-repeat;color:#fff;text-shadow:2px 2px 0 #3B1A7A}
.cell.one{box-shadow:inset 0 0 0 999px #FF8FC8;color:#7A1048}
.cell.p::after{display:none}
.mascot{object-fit:contain;background:#FFF6DF;image-rendering:pixelated;padding:4px}
.result img{object-fit:contain;background:#FFF6DF;image-rendering:pixelated;padding:4px}
.chestbox{display:flex;align-items:center;gap:14px}
.chestbox img{width:72px;height:66px;image-rendering:pixelated;flex:none}
.win img.big{width:220px;height:auto;border:0;animation:bob 1s steps(2) infinite;image-rendering:pixelated}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img class="mascot" id="mascotP" alt="質數 2">
  <div class="banner">
    <h1>質數尋寶地圖</h1>
    <p class="sub">偵探星仔帶你搵晒 25 個質數，打開寶箱！</p>
  </div>
  <img class="mascot r" id="mascotC" alt="合成數 12">
</header>

<div class="game">
  <div class="frame"><div class="board" id="board" role="grid" aria-label="1 至 100 地圖"></div></div>

  <div class="side">
    <div class="card">
      <div class="chestbox"><img id="chest" alt="寶箱"><div style="flex:1">
      <div class="count">已經搵到 <b id="found">0</b> / 25 個質數</div>
      <div class="stars" id="stars" aria-hidden="true"></div></div></div>
    </div>

    <div class="card result" id="result" aria-live="polite">
      <img id="resImg" alt="">
      <div class="bubble">
        <h2 id="resTitle">我係偵探星仔！</h2>
        <p id="resText">同學講出佢覺得係質數嘅數字同原因，老師就撳嗰格揭開。</p>
        <div class="dots" id="resDots"></div>
      </div>
    </div>

    <div class="card">
      <div class="legend" style="margin-bottom:12px">
        <span style="--k:var(--gold)">質數</span>
        <span style="--k:var(--pur)">合成數</span>
        <span style="--k:var(--pink)">1：兩樣都唔係</span>
      </div>
      <div class="btns">
        <button class="b" id="undo">復原上一步</button>
        <button class="b" id="peek">提示一個質數</button>
        <button class="b" id="reset">重新開始</button>
      </div>
    </div>

    <div class="card">
      <ol class="how">
        <li>同學講：「37 係質數，因為點排都只係排到一行。」</li>
        <li>老師撳 37 揭開：黃色係質數，紫色係合成數。</li>
        <li>揭到合成數唔緊要，睇吓佢點樣排成長方形。</li>
        <li>目標：全班一齊搵晒 25 個質數！</li>
      </ol>
    </div>
  </div>
</div>
<div class="parade" id="parade" aria-hidden="true"></div>
</div>

<div class="dlg" id="confirmDlg" role="dialog" aria-modal="true" aria-labelledby="cfT">
  <div class="card">
    <h2 id="cfT" style="margin-top:0">真係要重新開始？</h2>
    <p>所有已經揭開嘅格仔都會再蓋返。</p>
    <div class="btns" style="justify-content:center">
      <button class="b" id="cfNo">取消</button>
      <button class="b main" id="cfYes">重新開始</button>
    </div>
  </div>
</div>

<div class="dlg" id="winDlg" role="dialog" aria-modal="true" aria-labelledby="winT">
  <div class="card win">
    <img id="winImg" class="big" alt="打開咗嘅寶箱">
    <h2 id="winT">寶箱打開咗！</h2><p style="font-weight:900;font-size:20px;margin:0 0 6px">全班搵晒 25 個質數！</p>
    <p>你哋係質數偵探！</p>
    <button class="b main" id="winOk">好嘢！</button>
  </div>
</div>
<canvas id="confetti"></canvas>

  const k=kind(n);
  $('resImg').src=IMG.detective;
  if(k==='one'){$('resTitle').textContent='1：兩樣都唔係';$('resText').textContent='1 只有一個因數，所以佢既唔係質數，亦唔係合成數。';$('resDots').innerHTML='';return}
  if(k==='p'){$('resTitle').textContent=`${n} 係質數！`;$('resText').textContent=`${n} 粒圓點點排都只可以排成一行，冇其他排法。`;dots(1,n);return}
  let a=2;while(n%a)a++;const b=n/a;
  $('resTitle').textContent=`${n} 係合成數`;
  $('resText').textContent=`${n} = ${a} × ${b}，可以排成 ${a} 行，每行 ${b} 粒。`;
  dots(a,b);
}
function open(n){
  if(!opened.includes(n)){opened.push(n);save();render();
    const c=board.querySelector(`[data-n="${n}"]`);c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),500);
    if(isPrime(n)){burst(c);if(opened.filter(isPrime).length===25)setTimeout(win,600)}}
  explain(n);
}
board.addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)open(+c.dataset.n)});
$('undo').onclick=()=>{const n=opened.pop();save();render();if(n){$('resTitle').textContent=`已經蓋返 ${n}`;$('resText').textContent='再撳一次就可以重新揭開。';$('resDots').innerHTML=''}};
$('peek').onclick=()=>{const left=PRIMES.filter(p=>!opened.includes(p));if(!left.length)return;
  const p=left[Math.floor(Math.random()*left.length)];const row=Math.floor((p-1)/10);
  board.querySelectorAll('.cell').forEach(c=>c.classList.remove('hint'));
  $('resTitle').textContent='偵探提示';$('resText').textContent=`第 ${row+1} 行（${row*10+1} 至 ${row*10+10}）入面仲有質數未搵到。`;$('resDots').innerHTML='';$('resImg').src=IMG.detective;
  board.querySelectorAll('.cell').forEach(c=>{const n=+c.dataset.n;if(n>row*10&&n<=row*10+10&&!opened.includes(n))c.classList.add('hint')});
  setTimeout(()=>board.querySelectorAll('.hint').forEach(c=>c.classList.remove('hint')),4000)};
$('reset').onclick=()=>$('confirmDlg').classList.add('open');
$('cfNo').onclick=()=>$('confirmDlg').classList.remove('open');
$('cfYes').onclick=()=>{opened=[];save();render();$('confirmDlg').classList.remove('open');$('resTitle').textContent='我係偵探星仔！';$('resText').textContent='同學講出佢覺得係質數嘅數字同原因，老師就撳嗰格揭開。';$('resDots').innerHTML='';$('resImg').src=IMG.detective};
function win(){$('chest').src=IMG.chest_open;$('winDlg').classList.add('open');burst(null,160)}
$('winOk').onclick=()=>$('winDlg').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dlg.open').forEach(d=>d.classList.remove('open'))});
const cv=$('confetti'),ctx=cv.getContext('2d');let parts=[],raf=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(el,count=40){
  if(reduce)return;
  cv.width=innerWidth;cv.height=innerHeight;
  const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0};
  const cols=['#FFC21A','#2E9C9C','#FF8FC8','#B79BFF','#FFFFFF'];
  for(let i=0;i<count;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*10,vy:-Math.random()*10-3,s:6+Math.random()*6,c:cols[i%5],life:70});
  if(!raf)tick();
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.life--;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+20);
  raf=parts.length?requestAnimationFrame(tick):0;if(!raf)ctx.clearRect(0,0,cv.width,cv.height);
}
render();
if(opened.length)explain(opened[opened.length-1]);
}
</script>
